[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bid-agent"
version = "0.1.0"
description = "标书制作智能体 — AI-powered bid document generation"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Bid Agent Team" }
]
keywords = ["bid", "document-generation", "langgraph", "rag", "ai-agent"]

dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",
    "faiss-cpu>=1.8.0",
    "streamlit>=1.28.0",
    "PyMuPDF>=1.23.0",
    "python-docx>=1.1.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[tool.setuptools.packages.find]
include = ["core*", "gui*", "config*", "adapters*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# WorkBuddy 沙箱会拦截 /var/folders 下 pytest 根临时目录的重复 mkdir（EEXIST→PermissionError），
# 故将 basetemp 固化到项目内，保证 tmp_path fixture 在沙箱内可重复运行。
addopts = "--basetemp=.pytest_tmp"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "contract: Contract tests",
    "slow: Slow tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
